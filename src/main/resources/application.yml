spring:
  datasource:
    url: jdbc:mysql://localhost:3306/taskapi_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: ${JWT_SECRET:clave-secreta-para-firmar-jwt-que-tiene-al-menos-256-bits-ok}
  expiration: 86400000  # 24 horas en milisegundos

server:
  port: 8080